# Render Blueprint — リポジトリを選ぶだけで公開環境が自動構築される定義ファイル
# 手順は DEPLOY.md を参照
#
# 現在は【デモ公開モード＝無料プラン・カード登録不要】。
#   - 上司・お客様に実際に操作してもらう用途に十分
#   - 制約: 15分アクセスが無いとスリープし、次のアクセス時の初回表示に約1分かかる。
#           再起動・再デプロイでデータが初期状態に戻る（永続ディスクなし）
# 本運用へ切り替える時: plan を starter にし、下の disk: コメントを外す（約$7/月・データ永続化）。
services:
  - type: web
    name: crossimage-product-os
    runtime: docker
    plan: free # 本運用時: starter へ変更
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true # ブランチへのプッシュで自動再デプロイ
    # disk:                      # ← 本運用時にコメント解除（無料プランでは使えません）
    #   name: crossimage-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: AUTO_APPROVE_PROPOSALS
        value: "false"
      - key: SESSION_SECRET
        generateValue: true # Render が安全な乱数を自動生成
      - key: SEED_STAFF_PW
        generateValue: true # 社内ログインパスワード（Render管理画面のEnvironmentで確認）
      - key: SEED_CLIENT_PW
        generateValue: true # デモ顧客のパスワード（同上）
      - key: ANTHROPIC_API_KEY
        sync: false # 空のままでもOK（デモAIで動作）。本物のAIにする時に管理画面で設定
